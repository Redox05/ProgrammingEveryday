<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Random Points Challenge</title>
</head>
<body>
    <h2>Random Points Generator</h2>
    <button id="generatePointsButton">Generate Points</button>
    <div id="pointsResult"></div>
    <label for="quadrantSelect">Select Quadrant</label>
    <select id="quadrantSelect">
        <option value="All">All</option>
        <option value="Q1">Q1</option>
        <option value="Q2">Q2</option>
        <option value="Q3">Q3</option>
        <option value="Q4">Q4</option>
    </select>
    <canvas id="pointsCanvas" width="400" height="400" style="border: 1px solid black;"></canvas>

    <script>
        const generatePointsBtn = document.getElementById("generatePointsButton");
        const pointsResultGraphDisplay = document.getElementById("pointsResult");
        const selectQuarterDropdown = document.getElementById("quadrantSelect");
        const selectCanvas = document.getElementById("pointsCanvas");
        const canvasContext = selectCanvas.getContext("2d");
        let randomPoints = [];
        

        //Functions******************************************************************************************************
        function filterPointsByQuadrant(pointsArray, quadrantString) {
            if (quadrantString === "Q1") {
                return pointsArray.filter(point => point.x > 50 && point.y > 50);
            }
            else if (quadrantString === "Q2") {
                return pointsArray.filter(point => point.x < 50 && point.y > 50);
            }
            else if (quadrantString === "Q3") {
                return pointsArray.filter(point => point.x < 50 && point.y < 50);
            }
            else if (quadrantString === "Q4") {
                return pointsArray.filter(point => point.x > 50 && point.y < 50);
            }
            else if (quadrantString === "All") {
                return pointsArray;
            }
            else {
                throw new Error('Please enter a valid quadrant');
            }
        }
        function drawPoints(pointsToDraw) {
            canvasContext.clearRect(0, 0, 400, 400);
            pointsToDraw.forEach(point => {
                canvasContext.beginPath();
                canvasContext.arc(point.x * 4, (400-point.y*4), 4, 0, 2 * Math.PI);
                canvasContext.fill();
            })
}
        function updatePointsDisplay(totalRandomPoints, filteredPointsByQuadrant, quadrantString){
            pointsResultGraphDisplay.textContent = `Generated: ${totalRandomPoints.length} points | Displayed: ${filteredPointsByQuadrant.length} points | Quadrant: ${quadrantString}`;
            
        }

        
        generatePointsBtn.addEventListener("click", async ()=>{
            try {
                const response = await fetch("/points");
                if (response.ok) {
                    randomPoints = await response.json();
                    const pointsToDraw = filterPointsByQuadrant(randomPoints, selectQuarterDropdown.value);
                    drawPoints(pointsToDraw);
                    updatePointsDisplay(randomPoints, pointsToDraw, selectQuarterDropdown.value);
                }
                else { 
                    const message = await response.text();
                    pointsResultGraphDisplay.innerHTML = message;
                }
            }
            catch { 
                pointsResultGraphDisplay.innerHTML = `There was a network failure error`;
            }
        });
        selectQuarterDropdown.addEventListener("change", (event) => {
            const pointsToDraw = filterPointsByQuadrant(randomPoints,event.target.value);
            drawPoints(pointsToDraw);
            updatePointsDisplay(randomPoints, pointsToDraw, selectQuarterDropdown.value);
        });
    </script>

</body>
</html>
