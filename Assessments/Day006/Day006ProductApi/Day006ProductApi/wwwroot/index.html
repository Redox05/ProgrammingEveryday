<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    
</head>
<body>
    <h1>Products</h1>
    <button id="loadProductsButton">Load Products</button>
    <div id="products"></div>


    <h2>Add Product</h2>
    <input id="productId" type="number" placeholder="ID"/>
    <input id="productName" type="text" placeholder="Name"/>
    <input id="productQuantity" type="number" placeholder="Quantity"/>
    <button id="addProductButton">Add Product</button>
    <div id="addMessage"></div>

    <h2>Update Product</h2>
    <input id="updateId" type="number" placeholder="ID"/>
    <input id="updateName" type="text" placeholder="New Name"/>
    <input id="updateQuantity" type="number" placeholder="New Quantity"/>
    <button id="updateProduct">Update Product</button>
    <div id="updateMessage"></div>

    <h2>Delete Product</h2>
    <input id="deleteId" type="number" placeholder="ID">
    <button id="deleteProduct">Delete Product</button>
    <div id="deleteMessage"></div>

    <h2>Find Product</h2>
    <input id="findId" type="number" placeholder="ID"/>
    <button id="findProduct">Find Product</button>
    <div id="findMessage"></div>

    <h2>Low Stock Products</h2>
    <button id="lowStockProducts">Show Low Stock</button>
    <div id="lowStockMessage"></div>

    <script>

        const productsDiv = document.getElementById("products");

        //GET
        const loadButton = document.getElementById("loadProductsButton");
        loadButton.addEventListener("click", async () => {
            const response = await fetch("/products");
            console.log(response);

            const products = await response.json();
            console.log(products);

            console.log(products[0]);
            console.log(products[0].name);


            productsDiv.innerHTML = "";
            products.forEach(product => {
                productsDiv.innerHTML += `<p>${product.name}</p>`;
            });

        });

        //POST
        const idInput = document.getElementById("productId");
        const nameInput = document.getElementById("productName");
        const quantityInput = document.getElementById("productQuantity");
        const messageDiv = document.getElementById("addMessage");
        const addButton = document.getElementById("addProductButton");
        addButton.addEventListener("click", async () => {
            if (idInput.value == "") { 
                messageDiv.innerHTML = `ID is required`;
                return;
            }
            const id = Number(idInput.value);
            const idError = ValidatePositiveInteger(id);
            if (idError) { 
                messageDiv.innerHTML = `ID ${idError}`;
                return;
            }

            if (nameInput.value.trim() === "") {
                messageDiv.innerHTML = `Name is required`;
                return;
            }
            const name = nameInput.value;

            if (quantityInput.value == "") { 
                messageDiv.innerHTML = `Quantity is required`;
                return;
            }
            const quantity = Number(quantityInput.value);
            const quantityError = ValidatePositiveInteger(quantity);
            if (quantityError) { 
                messageDiv.innerHTML = `Quantity ${quantityError}`;
                return;
            }

            const newProduct = {
                id,
                name,
                quantity
            };

            try {
                const jsonProduct = JSON.stringify(newProduct);

                const response = await fetch("/products", {

                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: jsonProduct
                });
                console.log(response);

                if (response.ok) {
                    messageDiv.innerHTML = `Product created successfully`;
                }
                else {
                    const errorMessage = await response.json();

                    console.log(errorMessage);
                    console.log(typeof errorMessage);

                    messageDiv.innerHTML = errorMessage;
                }
            }
            catch {
                messageDiv.innerHTML = `Could not connect to the server`;
            }
        });

        //PUT
        const putIdInput = document.getElementById("updateId");
        const putNameInput = document.getElementById("updateName");
        const putQuantityInput = document.getElementById("updateQuantity");
        const updateButton = document.getElementById("updateProduct");
        const putMessage = document.getElementById("updateMessage");
        updateButton.addEventListener("click", async () => {
            putMessage.innerHTML = `Update Button Clicked`;

            const id = Number(putIdInput.value);
            const name = putNameInput.value;
            const quantity = Number(putQuantityInput.value);

            const updatedProduct = {
                id,
                name,
                quantity
            }

            console.log(updatedProduct);
            console.log(typeof updatedProduct.id);
            console.log(typeof updatedProduct.name);
            console.log(typeof updatedProduct.quantity);

            const url = `/products/${id}`;
            console.log(url);

            try {
                const jsonProduct = JSON.stringify(updatedProduct);

                const response = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: jsonProduct
                });
                console.log(response);
                if (response.ok) {
                    putMessage.innerHTML = `Product updated successfully`;
                }
                else {
                    const errorMessage = await response.json();
                    console.log(errorMessage);
                    putMessage.innerHTML = errorMessage;
                }
            }
            catch (error) {
                console.log(error);
                putMessage.innerHTML = `Could not connect to the server`;
            }
        });

        //DELETE
        const deleteId = document.getElementById("deleteId");
        const deleteProduct = document.getElementById("deleteProduct");
        const deleteMessage = document.getElementById("deleteMessage");
        deleteProduct.addEventListener("click", async () => {

            if (deleteId.value == "") { 
                deleteMessage.innerHTML = `ID is required`;
                return;
            }
            const id = Number(deleteId.value);

            if (!IsPositiveInteger(id)) { 
                deleteMessage.innerHTML = `ID must be a positive integer`;
                return;
            }
            const url = `/products/${id}`;


            try {
                
                console.log(url);
                const response = await fetch(url, {
                    method: "DELETE"
                });
                console.log(response);
                if (response.ok) {
                    deleteMessage.innerHTML = `Product Deleted Successfully`;
                }
                else {
                    const errorMessage = await response.json();
                    console.log(errorMessage);
                    deleteMessage.innerHTML = errorMessage;
                }
            }
            catch (error) {
                console.log(error);
                deleteMessage.innerHTML = `Could not connect to the server`;
            }
        });

        //Validation functions
        function IsPositiveInteger(number){
            return number > 0 && Number.isInteger(number);
        }
        function ValidatePositiveInteger(number){
            if (Number.isNaN(number)) { 
                return `Enter a valid number`;
            }
            if (number <= 0) { 
                return `must be greater than zero`;
            }
            if (!Number.isInteger(number)) { 
                return `must be an integer`;
            }
            return "";
}

        //Find Product
        const findIdInput = document.getElementById("findId");
        const findProductBtn = document.getElementById("findProduct");
        const findMessage = document.getElementById("findMessage");
        findProductBtn.addEventListener("click", async () =>{
            if (findIdInput.value == "") { 
                findMessage.innerHTML = `ID is required`;
                return;
            }
            const id = Number(findIdInput.value);
            const findError = ValidatePositiveInteger(id);
            if (findError) {
                findMessage.innerHTML = `ID ${findError}`;
                return;
            }
            findMessage.innerHTML = ``;
            console.log("Valid ID");

            try {
                const url = `/products/${id}`;
                const response = await fetch(url);
                console.log(response);
                if (response.ok) {
                    const foundProduct = await response.json();
                    console.log(foundProduct);
                    findMessage.innerHTML = `${foundProduct.name} - Quantity: ${foundProduct.quantity}`;
                }
                else { 
                    const errorMessage = await response.text();
                    console.log(errorMessage);
                    findMessage.innerHTML = errorMessage;
                }
            }
            catch {
                findMessage.innerHTML = `Could not connect to the server`;
            }
        });

        //Show Low Stock Products
        const lowStockBtn = document.getElementById("lowStockProducts");
        const lowStockMessage = document.getElementById("lowStockMessage");
        //Functions
        function GetLowStockProducts(products, lowStockLimit=5){
            const filteredArray = products.filter(product => product.quantity <= lowStockLimit);
            return filteredArray;
}
        function GetProductDisplayStrings(products){
            const productsNameQuantity = products.map(product => `${product.name} - Quantity ${product.quantity}`);
            return productsNameQuantity;
}
        function JoinProductDisplayStrings(productStrings){
            const productText = productStrings.join("<br>");
            return productText;
        }
        lowStockBtn.addEventListener("click", async () =>{
            try {
                const response = await fetch("/products");
                console.log(response);

                if (response.ok) {
                    const lowStockProdArray = await response.json();
                    console.log(lowStockProdArray);
                    const lowStock = GetLowStockProducts(lowStockProdArray);
                    console.log(lowStock);
                    if (lowStock.length === 0) {
                        lowStockMessage.innerHTML = `No low-stock products`;
                        return;
                    }
                    const lowStockText = GetProductDisplayStrings(lowStock);
                    console.log(lowStockText);
                    lowStockMessage.innerHTML = JoinProductDisplayStrings(lowStockText);
                }
                else { 
                    const lowStockErrorMessage = await response.text();
                    console.log(lowStockErrorMessage);
                    lowStockMessage.innerHTML = lowStockErrorMessage;
                }
                
            }
            catch { 
                lowStockMessage.innerHTML = `Could not connect to the server`;
            }
        });
    </script> 
</body>
</html>
